<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi</title>
  <!-- Menghubungkan halaman ini dengan file desain (CSS) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BAGIAN ATAS: logo dan nama aplikasi -->
  <div class="header">
    <div class="logo">LOGO</div>
    <div class="judul-app">Aplikasi Pencatatan Keuangan Harian<br>Mahasiswa</div>
  </div>

  <!-- ISI HALAMAN: kotak registrasi di tengah -->
  <div class="halaman-auth">
    <div class="kotak-auth">
      <h1>Registrasi</h1>
      <p class="sub">Buat akun untuk mulai mencatat keuangan harian</p>

      <!-- Setelah klik "Daftar", pindah ke halaman login -->
      <form id="formRegistrasi">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="namaLengkap" placeholder="Masukkan nama lengkap">
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Masukkan username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Masukkan password">
        </div>
        <div class="form-group">
          <label>Konfirmasi Password</label>
          <input type="password" id="konfirmasi" placeholder="Ulangi password">
        </div>
        <!-- Tempat pesan salah/berhasil muncul -->
        <p id="pesan" class="pesan"></p>
        <button class="btn btn-utama btn-penuh" type="submit">Daftar</button>
      </form>

      <p class="link-bawah">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
